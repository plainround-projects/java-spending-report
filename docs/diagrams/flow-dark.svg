<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="796" viewBox="0 0 1200 796" role="img" aria-labelledby="t d">
<title id="t">One run of spend over the 25-row sample</title>
<desc id="d">Six steps top to bottom across five lanes. SpendCli wires the run and asks CsvFileRowSource to read. The source sends each line to CsvRowParser, which answers Ok or, on a bad row, Rejected as data. The accumulator takes every row and returns an immutable report. ReportPrinter prints it and SpendCli exits with status 2 because ten rows were rejected.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="795" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="794" rx="16"/>
<text class="title" x="48" y="68">One CSV file, one report</text>
<text class="caption" x="48" y="100">make run: 25 rows. Amber: a bad row is data and the run goes on to exit status 2.</text>
<rect class="actor" x="400" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">SpendCli</text>
<rect class="svc" x="530" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="600" y="148" text-anchor="middle">CsvFile</text>
<text class="lane" x="600" y="168" text-anchor="middle">RowSource</text>
<rect class="svc" x="679" y="128" width="152" height="48" rx="10"/>
<text class="lane" x="755" y="158" text-anchor="middle">CsvRowParser</text>
<rect class="svc" x="839" y="128" width="142" height="48" rx="10"/>
<text class="lane" x="910" y="148" text-anchor="middle">Spending</text>
<text class="lane" x="910" y="168" text-anchor="middle">Accumulator</text>
<rect class="svc" x="989" y="128" width="162" height="48" rx="10"/>
<text class="lane" x="1070" y="158" text-anchor="middle">ReportPrinter</text>
<path class="hair" d="M460 176V664M600 176V472M755 176V424M910 176V536M1070 176V600"/>
<path class="hair" d="M66 216V664"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">SpendCli wires the run</text>
<text class="sub" x="96" y="232">Settings, parser, source</text>
<rect class="slot" x="454" y="198" width="12" height="36" rx="4"/>
<text class="label t-accent" x="476" y="221">wire, run()</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">The source opens the file</text>
<text class="sub" x="96" y="296">UTF-8, BOM off, header skipped</text>
<path class="sync" d="M460 280H600"/>
<text class="label t-accent" x="476" y="270">run, readRows</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">Each data line is parsed</text>
<text class="sub" x="96" y="360">5 fields, date, amount, currency</text>
<path class="sync" d="M600 344H755"/>
<text class="label t-accent" x="616" y="334">parse(n, line)</text>
<circle class="dot-w" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="404">A bad row is data, not a crash</text>
<text class="sub" x="96" y="424">line 13: amount is not a number</text>
<path class="fail" d="M755 408H600"/>
<text class="label t-warn" x="616" y="398">Rejected</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="468">The accumulator takes the row</text>
<text class="sub" x="96" y="488">Ok adds, Rejected is kept</text>
<path class="sync" d="M600 472H910"/>
<text class="label t-accent" x="771" y="462">accept(row)</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">The report comes back</text>
<text class="sub" x="96" y="552">immutable, months oldest first</text>
<path class="ok" d="M910 536H460"/>
<text class="label t-good" x="616" y="526">SpendingReport</text>
<circle class="dot" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6a</text>
<text class="label b t-ink" x="96" y="596">ReportPrinter rounds once</text>
<text class="sub" x="96" y="616">half-even, to standard output</text>
<path class="sync" d="M460 600H1070"/>
<text class="label t-accent" x="926" y="590">print()</text>
<circle class="dot-g" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">6b</text>
<text class="label b t-ink" x="96" y="660">SpendCli sets the exit status</text>
<text class="sub" x="96" y="680">2, because 10 rows were rejected</text>
<rect class="slot" x="454" y="646" width="12" height="36" rx="4"/>
<path class="ok" d="M472 664H640"/>
<text class="label t-good" x="490" y="654">hasRejects</text>
<rect class="win" x="640" y="644" width="158" height="40" rx="10"/>
<text class="label b t-good" x="656" y="669">exit status: 2</text>
<path class="sync" d="M48 752H112"/><text class="legend" x="124" y="757">sync call</text>
<path class="fail" d="M696 752H760"/><text class="legend" x="772" y="757">failure path</text>
<path class="ok" d="M928 752H992"/><text class="legend" x="1004" y="757">result</text>
</svg>
