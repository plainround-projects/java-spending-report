<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="912" viewBox="0 0 1200 912" role="img" aria-labelledby="t d">
<title id="t">Architecture of spend, the spending report tool</title>
<desc id="d">A shell runs java -jar target/spend.jar on a CSV file. Inside one JVM, SpendCli builds the use case BuildSpendingReport, which asks CsvFileRowSource to read the file. CsvFileRowSource sends each line to CsvRowParser and each Ok or Rejected result to SpendingAccumulator. The accumulator hands the SpendingReport back, SpendCli passes it to ReportPrinter, and the text goes to the terminal while the exit status goes back to the shell. A note shows the quote bug that make quote-check proves.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="911" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="910" rx="16"/>
<text class="title" x="48" y="68">One file in, one report out</text>
<text class="caption" x="48" y="100">Rows stream left to right along the bottom. Amber: the quote bug that make quote-check proves.</text>
<rect class="actor" x="60" y="140" width="300" height="72" rx="36"/>
<text class="name" x="210" y="172" text-anchor="middle">Shell</text>
<text class="sub" x="210" y="194" text-anchor="middle">java -jar target/spend.jar</text>
<rect class="actor" x="840" y="140" width="300" height="72" rx="36"/>
<text class="name" x="990" y="172" text-anchor="middle">Terminal</text>
<text class="sub" x="990" y="194" text-anchor="middle">stdout report, stderr logs</text>
<rect class="boundary" x="48" y="240" width="1104" height="472" rx="14"/>
<text class="tag" x="470" y="268">spend.jar: one JVM, no server</text>
<rect class="svc" x="80" y="296" width="260" height="96" rx="12"/>
<text class="name" x="96" y="328">SpendCli</text>
<text class="sub" x="96" y="352">interfaces.cli</text>
<text class="sub" x="96" y="374">flags, env, exit status</text>
<rect class="svc" x="860" y="296" width="260" height="96" rx="12"/>
<text class="name" x="876" y="328">ReportPrinter</text>
<text class="sub" x="876" y="352">interfaces.cli</text>
<text class="sub" x="876" y="374">the only rounding</text>
<rect class="svc" x="470" y="440" width="260" height="96" rx="12"/>
<text class="name" x="486" y="472">BuildSpendingReport</text>
<text class="sub" x="486" y="496">application: the use case</text>
<text class="sub" x="486" y="518">calls the RowSource port</text>
<rect class="svc" x="80" y="584" width="260" height="96" rx="12"/>
<text class="name" x="96" y="616">CsvRowParser</text>
<text class="sub" x="96" y="640">CsvFieldSplitter inside</text>
<text class="sub" x="96" y="662">Ok or Rejected per row</text>
<rect class="svc" x="470" y="584" width="260" height="96" rx="12"/>
<text class="name" x="486" y="616">CsvFileRowSource</text>
<text class="sub" x="486" y="640">adapter for RowSource</text>
<text class="sub" x="486" y="662">UTF-8, BOM, line numbers</text>
<rect class="svc" x="860" y="584" width="260" height="96" rx="12"/>
<text class="name" x="876" y="616">SpendingAccumulator</text>
<text class="sub" x="876" y="640">domain: sums per month</text>
<text class="sub" x="876" y="662">top 5, 1000 rejects kept</text>
<path class="store" d="M470 756a130 12 0 0 1 260 0v76a130 12 0 0 1 -260 0z"/>
<path class="rim" d="M470 756a130 12 0 0 0 260 0"/>
<text class="name" x="600" y="788" text-anchor="middle">CSV file</text>
<text class="sub" x="600" y="810" text-anchor="middle">one transaction per line</text>
<rect class="note" x="80" y="744" width="300" height="100" rx="10"/>
<text class="label b t-warn" x="96" y="774">make quote-check</text>
<text class="sub" x="96" y="800">no quote handling: a good</text>
<text class="sub" x="96" y="822">row splits in two columns</text>
<path class="sync" d="M170 212V296"/>
<text class="label t-accent" x="178" y="232">args</text>
<path class="ok" d="M250 296V212"/>
<text class="label t-good" x="258" y="232">exit status</text>
<path class="ok" d="M990 296V212"/>
<text class="label t-good" x="998" y="232">report text</text>
<path class="sync" d="M340 330H860"/>
<text class="label t-accent" x="352" y="320">print(report)</text>
<path class="sync" d="M210 392V470Q210 482 222 482H470"/>
<text class="label t-accent" x="232" y="472">run()</text>
<path class="sync" d="M600 536V584"/>
<text class="label t-accent" x="612" y="566">readRows(accept)</text>
<path class="sync" d="M470 620H340"/>
<text class="label t-accent" x="350" y="610">parse(line)</text>
<path class="sync" d="M730 620H860"/>
<text class="label t-accent" x="742" y="610">accept(row)</text>
<path class="ok" d="M990 584V500Q990 488 978 488H730"/>
<text class="label t-good" x="744" y="478">SpendingReport</text>
<path class="read" d="M600 744V680"/>
<text class="label" x="612" y="722">Files.lines</text>
<path class="fail" d="M210 680V744"/>
