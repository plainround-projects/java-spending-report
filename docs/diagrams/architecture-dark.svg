<path class="sync" d="M48 868H112"/><text class="legend" x="124" y="873">sync call</text>
<path class="read" d="M520 868H584"/><text class="legend" x="596" y="873">read</text>
<path class="fail" d="M696 868H760"/><text class="legend" x="772" y="873">failure path</text>
<path class="ok" d="M928 868H992"/><text class="legend" x="1004" y="873">result</text>
</svg>
